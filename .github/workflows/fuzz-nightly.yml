name: Nightly fuzzing

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      seconds:
        description: AFL++ campaign duration
        required: false
        default: '3600'

permissions:
  contents: read

concurrency:
  group: nightly-fuzz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  garden:
    name: Garden report
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report the upkeep the tree needs (docs/garden.md)
        run: |
          python3 tools/garden.py --online --limit 0 > garden.txt || true
          { echo '```'; cat garden.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          tail -n 1 garden.txt
      - name: Fail on docs drift or tracked leftovers
        run: make check-garden

  coverage:
    # The compiler edge and runtime line/branch coverage floors (Makefile MIN_*_COVERAGE). Nightly rather than per
    # push: they have been below their floors since 2026-10 (docs/records, garden lane report), and a per-push gate
    # that is always red hides every other result.
    name: Coverage floors
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Python 3.15.0
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Install pinned LLVM 23.1.3
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd libxml2 libtinfo6
          archive="$RUNNER_TEMP/LLVM-23.1.3-Linux-X64.tar.zst"
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 600 \
            'https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.3/LLVM-23.1.3-Linux-X64.tar.zst' -o "$archive"
          printf '%s  %s\n' \
            '14d2f701eb68fb799001bdea6231048f3990690fa2f406d563555ff8f744daba' \
            "$archive" | sha256sum --check
          sudo mkdir -p '/usr/lib/llvm-23'
          # LLVM's archive needs a 1 GiB decode window, above zstd's 128 MiB default.
          sudo tar --use-compress-program='zstd --long=30' -xf "$archive" -C '/usr/lib/llvm-23' --strip-components=1
          echo "/usr/lib/llvm-23/bin" >> "$GITHUB_PATH"
          for key in CC LLVM_CC MINYAR_CLANG MINYAR_TEST_CLANG; do echo "$key=/usr/lib/llvm-23/bin/clang" >> "$GITHUB_ENV"; done
          MINYAR_CLANG=/usr/lib/llvm-23/bin/clang sh tools/toolchain.sh toolchain
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y make zsh
      - name: Measure coverage against the floors
        run: |
          make -j1 LIMITED= SANITIZER_LIMITED= build/tooling/scripts/check-linux
          ./build/tooling/scripts/check-linux --source . --output-dir build/linux-evidence --jobs 4 \
            --clang /usr/lib/llvm-23/bin/clang --cxx /usr/lib/llvm-23/bin/clang++ --group coverage
      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-evidence
          if-no-files-found: warn
          path: |
            build/linux-evidence/*/results.json
            build/linux-evidence/*/logs
            build/linux-evidence/**/build/coverage
            build/linux-evidence/**/build/mutation-score.json

  afl:
    name: Persistent AFL++ sanitizer campaign
    runs-on: ubuntu-24.04
    # Leave headroom for setup and corpus persistence around the one-hour
    # scheduled campaign. Manual runs may use the six-hour job limit.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned LLVM 23.1.3
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd libxml2 libtinfo6
          archive="$RUNNER_TEMP/LLVM-23.1.3-Linux-X64.tar.zst"
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 600 \
            'https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.3/LLVM-23.1.3-Linux-X64.tar.zst' -o "$archive"
          printf '%s  %s\n' \
            '14d2f701eb68fb799001bdea6231048f3990690fa2f406d563555ff8f744daba' \
            "$archive" | sha256sum --check
          sudo mkdir -p '/usr/lib/llvm-23'
          # LLVM's archive needs a 1 GiB decode window, above zstd's 128 MiB default.
          sudo tar --use-compress-program='zstd --long=30' -xf "$archive" -C '/usr/lib/llvm-23' --strip-components=1
          echo "/usr/lib/llvm-23/bin" >> "$GITHUB_PATH"
          for key in CC LLVM_CC MINYAR_CLANG MINYAR_TEST_CLANG; do echo "$key=/usr/lib/llvm-23/bin/clang" >> "$GITHUB_ENV"; done
          MINYAR_CLANG=/usr/lib/llvm-23/bin/clang sh tools/toolchain.sh toolchain
      - name: Build AFL++ against the pinned LLVM
        # Ubuntu's afl++ instruments with clang 18, which cannot read the LLVM 23 IR the compiler emits.
        run: |
          sudo apt-get update && sudo apt-get install -y make zsh
          # Release 4.40c stops at LLVM 22; this dev commit (2026-11-08) is the first to accept LLVM 23.
          git init --quiet "$RUNNER_TEMP/aflpp"
          git -C "$RUNNER_TEMP/aflpp" fetch --quiet --depth 1 https://github.com/AFLplusplus/AFLplusplus.git 24f7f9768b4290a39382ac8c7b101b60306015c3
          git -C "$RUNNER_TEMP/aflpp" checkout --quiet FETCH_HEAD
          make -C "$RUNNER_TEMP/aflpp" -j4 all LLVM_CONFIG=/usr/lib/llvm-23/bin/llvm-config \
            CC=/usr/lib/llvm-23/bin/clang CXX=/usr/lib/llvm-23/bin/clang++ NO_PYTHON=1
          test -x "$RUNNER_TEMP/aflpp/afl-clang-fast"
          echo "$RUNNER_TEMP/aflpp" >> "$GITHUB_PATH"
      - name: Configure direct crash reporting for AFL++
        run: sudo sysctl -w kernel.core_pattern=core
      - name: Restore evolving AFL++ corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/afl-findings
          # v2 drops crash files produced before the ASan-safe stack guard.
          key: minyar-afl-v2-${{ github.run_id }}
          restore-keys: minyar-afl-v2-
      - name: Run coverage-guided compiler fuzzing
        env:
          MINYAR_AFL_SECONDS: ${{ inputs.seconds || '3600' }}
        run: make LIMITED= SANITIZER_LIMITED= check-fuzz-coverage
      - name: Save evolving AFL++ corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/afl-findings
          key: minyar-afl-v2-${{ github.run_id }}
      - name: Archive findings and replayable queue
        if: always()
        run: |
          if [ -d build/afl-findings ]; then
            tar -czf build/afl-findings.tar.gz -C build afl-findings
          fi
      - name: Upload findings and replayable queue
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: afl-findings-${{ github.run_id }}
          path: build/afl-findings.tar.gz

  semantic-programs:
    name: Generated program differential campaign
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned LLVM 23.1.3
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd libxml2 libtinfo6
          archive="$RUNNER_TEMP/LLVM-23.1.3-Linux-X64.tar.zst"
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 600 \
            'https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.3/LLVM-23.1.3-Linux-X64.tar.zst' -o "$archive"
          printf '%s  %s\n' \
            '14d2f701eb68fb799001bdea6231048f3990690fa2f406d563555ff8f744daba' \
            "$archive" | sha256sum --check
          sudo mkdir -p '/usr/lib/llvm-23'
          # LLVM's archive needs a 1 GiB decode window, above zstd's 128 MiB default.
          sudo tar --use-compress-program='zstd --long=30' -xf "$archive" -C '/usr/lib/llvm-23' --strip-components=1
          echo "/usr/lib/llvm-23/bin" >> "$GITHUB_PATH"
          for key in CC LLVM_CC MINYAR_CLANG MINYAR_TEST_CLANG; do echo "$key=/usr/lib/llvm-23/bin/clang" >> "$GITHUB_ENV"; done
          MINYAR_CLANG=/usr/lib/llvm-23/bin/clang sh tools/toolchain.sh toolchain
      - name: Install compiler dependencies
        # Ubuntu's clang is LLVM 18; the toolchain stamp requires the pinned LLVM above.
        run: sudo apt-get update && sudo apt-get install -y make zsh pkg-config libssl-dev
      - name: Bootstrap compiler, runtime and fuzz campaign
        run: make LIMITED= SANITIZER_LIMITED= build/minyarc build/minyar-runtime.o build/tooling/tests/fuzz
      - name: Compare generated programs across optimization levels
        run: ./build/tooling/tests/fuzz --cases 1000 --program-cases 200 --seed "$(date -u +%Y%m%d)"
      - name: Upload replayable semantic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-semantic-fuzz
          if-no-files-found: error
          path: build/fuzz
