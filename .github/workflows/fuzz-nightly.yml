name: Nightly fuzzing

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      seconds:
        description: AFL++ campaign duration
        required: false
        default: '3600'

permissions:
  contents: read

concurrency:
  group: nightly-fuzz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  afl:
    name: Persistent AFL++ sanitizer campaign
    runs-on: ubuntu-24.04
    # Leave headroom for setup and corpus persistence around the one-hour
    # scheduled campaign. Manual runs may use the six-hour job limit.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install AFL++ and LLVM
        run: sudo apt-get update && sudo apt-get install -y afl++ clang lld make zsh
      - name: Configure direct crash reporting for AFL++
        run: sudo sysctl -w kernel.core_pattern=core
      - name: Restore evolving AFL++ corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/afl-findings
          # v2 drops crash files produced before the ASan-safe stack guard.
          key: minyar-afl-v2-${{ github.run_id }}
          restore-keys: minyar-afl-v2-
      - name: Run coverage-guided compiler fuzzing
        env:
          MINYAR_AFL_SECONDS: ${{ inputs.seconds || '3600' }}
        run: make LIMITED= SANITIZER_LIMITED= CC=clang LLVM_CC=clang COMPILER_LTO_FLAGS='-flto -fuse-ld=lld' check-fuzz-coverage
      - name: Save evolving AFL++ corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/afl-findings
          key: minyar-afl-v2-${{ github.run_id }}
      - name: Archive findings and replayable queue
        if: always()
        run: |
          if [ -d build/afl-findings ]; then
            tar -czf build/afl-findings.tar.gz -C build afl-findings
          fi
      - name: Upload findings and replayable queue
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: afl-findings-${{ github.run_id }}
          path: build/afl-findings.tar.gz

  semantic-programs:
    name: Generated program differential campaign
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install compiler dependencies
        run: sudo apt-get update && sudo apt-get install -y clang lld make zsh
      - name: Bootstrap compiler and runtime
        run: make LIMITED= SANITIZER_LIMITED= CC=clang LLVM_CC=clang COMPILER_LTO_FLAGS='-flto -fuse-ld=lld' build/minyarc build/minyar-runtime.o
      - name: Compare generated programs across optimization levels
        run: python3 tests/fuzz.py --cases 1000 --program-cases 200 --seed "$(date -u +%Y%m%d)"
      - name: Upload replayable semantic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-semantic-fuzz
          if-no-files-found: error
          path: build/fuzz
