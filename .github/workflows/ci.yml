name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formatting:
    name: Pinned C formatting
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install the repository formatter
        run: python3 -m pip install clang-format==23.1.2
      - name: Check maintained C components
        run: python3 scripts/format.py

  linux-correctness:
    name: Linux correctness and sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install LLVM test dependencies
        run: sudo apt-get update && sudo apt-get install -y clang lld make zsh libglfw3-dev libssl-dev pkg-config redis-server
      - name: Check native graphics and launcher arguments
        run: python3 tests/native-graphics.py && python3 tests/toolchain-portability.py
      - name: Verify GCC bootstrap arithmetic with UBSan
        run: MINYAR_TEST_BOOTSTRAP_CC=gcc python3 tests/bootstrap-portability.py
      - name: Run isolated correctness matrix
        run: python3 scripts/check-linux.py --source . --output-dir build/linux-evidence
      - name: Check live-state fencing against independent Redis
        run: make LIMITED= SANITIZER_LIMITED= check-peer-live-redis check-peer-live-redis-sanitize
      - name: Replay runtime checks with LeakSanitizer
        run: |
          for run in build/linux-evidence/minyar-linux-*; do
            python3 scripts/check-linux-leaks.py --run-dir "$run"
          done
      - name: Upload correctness evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-correctness-evidence
          if-no-files-found: error
          path: |
            build/linux-evidence/**/*.json
            build/linux-evidence/**/*.log
            build/linux-evidence/**/build/quic-official-adapter.*
            build/linux-evidence/**/build/fuzz
            build/linux-evidence/**/build/mutation

  macos-portable:
    name: macOS portable suite
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install GLFW for native renderer checks
        run: brew install glfw pkg-config openssl@3
      - name: Run compiler, runtime, modules, fuzzing, and fixed point
        run: |
          export PATH="$(brew --prefix openssl@3)/bin:$PATH"
          make LIMITED= SANITIZER_LIMITED= check-portable
      - name: Check status icons and opaque Keychain signatures
        run: |
          export PATH="$(brew --prefix openssl@3)/bin:$PATH"
          python3 tests/macos-services.py
          python3 tests/keychain-native.py
          python3 tests/desktop-native.py
      - name: Check native graphics and launcher arguments
        run: python3 tests/native-graphics.py && python3 tests/toolchain-portability.py
      - name: Upload generated fuzz evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-fuzz-evidence
          path: build/fuzz

  macos-network:
    name: macOS shared socket and app loop
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check real kqueue readiness, AppKit wakes and timers
        run: python3 tests/macos-network.py
      - name: Check explicit UDP offload absence with native and sanitized providers
        run: make -j1 LIMITED= SANITIZER_LIMITED= check-net-udp-offload check-net-udp-offload-sanitize

  macos-ordinary-performance:
    name: macOS ordinary compiler and runtime budgets
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Build the ordinary fixed-point compiler
        run: |
          make LIMITED= SANITIZER_LIMITED= build/minyarc build/compiler-stage3.ll build/minyar-runtime.o
          cmp build/compiler-stage2.ll build/compiler-stage3.ll
      - name: Record native platform and PMU availability
        run: |
          mkdir -p build/performance-evidence
          uname -a | tee build/performance-evidence/platform.txt
          clang --version | tee build/performance-evidence/compiler.txt
          sysctl -n machdep.cpu.brand_string | tee build/performance-evidence/cpu.txt
          /usr/bin/time -l true 2> build/performance-evidence/pmu.txt
          cat build/performance-evidence/pmu.txt
      - name: Enforce unchanged supported self-compilation ceilings
        run: |
          set -o pipefail
          make LIMITED= SANITIZER_LIMITED= check-budget | tee build/performance-evidence/self-compile-budget.txt
          if grep -q 'instructions retired:' build/performance-evidence/self-compile-budget.txt; then
            grep 'instructions retired:' build/performance-evidence/self-compile-budget.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo '**Retired instructions unavailable:** this runner does not expose the counter. The unchanged 75-million-instruction limit is not measured by this job; see the explicit PMU probe evidence.' | tee -a "$GITHUB_STEP_SUMMARY" build/performance-evidence/instructions-unavailable.txt
          fi
      - name: Enforce ordinary runtime and compiler performance checks
        if: success() || failure()
        run: |
          set -o pipefail
          make LIMITED= SANITIZER_LIMITED= check-performance | tee build/performance-evidence/performance.txt
      - name: Upload platform and unchanged-gate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-ordinary-performance-evidence
          if-no-files-found: error
          path: |
            build/performance-evidence
            build/performance.json

  windows-portable:
    name: Windows portable suite
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      MAKEFLAGS: -j1
    steps:
      - name: Enable checkout of long research evidence paths
        shell: pwsh
        run: git config --system core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            diffutils
            zsh
            python
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-lld
            mingw-w64-ucrt-x86_64-glfw
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-lld
            mingw-w64-clang-x86_64-compiler-rt
      - name: Prepare pinned native Windows Python peers
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $peerRoot = Join-Path $env:RUNNER_TEMP 'minyar-peer-python'
          python -m venv $peerRoot
          if ($LASTEXITCODE -ne 0) { throw 'Native peer venv creation failed' }
          $peerPython = Join-Path $peerRoot 'Scripts\python.exe'
          & $peerPython -m pip install --disable-pip-version-check --only-binary=:all: -r tests/interop/peergrpc/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Pinned native peer wheel installation failed' }
          New-Item -ItemType Directory -Path build -Force | Out-Null
          & $peerPython scripts/check-peer-python.py | Out-File build/peer-python-imports.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw 'Pinned native peer import verification failed' }
          $cygpath = Join-Path $env:MSYS2_LOCATION 'usr\bin\cygpath.exe'
          $peerPosix = & $cygpath -u $peerPython
          if ($LASTEXITCODE -ne 0) { throw 'Native peer path translation failed' }
          "PEER_GRPC_PYTHON=$peerPosix" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run compiler, runtime, modules, fuzzing, and fixed point
        shell: msys2 {0}
        env:
          MINYAR_SANITIZER_CLANG: /clang64/bin/clang.exe
        run: make -k LIMITED= SANITIZER_LIMITED= COMPILER_LTO_FLAGS= CC=clang LLVM_CC=clang PEER_SUITES=tests/peer-regressions.py check-portable
      - name: Check native Windows OpenGL renderer and launcher arguments
        shell: msys2 {0}
        run: python3 tests/native-graphics.py && python3 tests/toolchain-portability.py
      - name: Check native Windows desktop and certificate providers
        shell: msys2 {0}
        run: python3 tests/windows-bridge.py
      - name: Check native SChannel TLS and nonexportable client certificates
        shell: msys2 {0}
        run: python3 tests/schannel.py
      - name: Check native Windows collector oracles and execution domains
        if: success() || failure()
        shell: msys2 {0}
        env:
          MINYAR_SANITIZER_CLANG: /clang64/bin/clang.exe
        run: make LIMITED= SANITIZER_LIMITED= COMPILER_LTO_FLAGS= CC=clang LLVM_CC=clang check-managed-graphs-profiles check-callback-domains check-callbacks check-net-udp-offload-sanitize
      - name: Upload generated fuzz evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-fuzz-evidence
          path: build/fuzz
      - name: Verify native Windows 64-bit sparse-file sizing
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $toolchainBin = Join-Path $env:MSYS2_LOCATION 'ucrt64\bin'
          $env:MINYAR_TEST_CLANG = Join-Path $toolchainBin 'clang.exe'
          $env:PATH = "$toolchainBin;$env:PATH"
          python tests/windows-large-file.py

  coverage-guided-fuzzing:
    name: AFL++ coverage-guided smoke campaign
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install AFL++ and LLVM
        run: sudo apt-get update && sudo apt-get install -y afl++ clang lld make zsh
      - name: Configure direct crash reporting for AFL++
        run: sudo sysctl -w kernel.core_pattern=core
      - name: Run coverage-guided compiler fuzzing
        env:
          MINYAR_AFL_SECONDS: '60'
        run: make LIMITED= SANITIZER_LIMITED= CC=clang LLVM_CC=clang COMPILER_LTO_FLAGS='-flto -fuse-ld=lld' check-fuzz-coverage
      - name: Archive fuzzing findings
        if: always()
        run: |
          if [ -d build/afl-findings ]; then
            tar -czf build/afl-findings.tar.gz -C build afl-findings
          fi
      - name: Upload fuzzing findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: afl-findings
          path: build/afl-findings.tar.gz

  windows-isolated-workers:
    name: Windows managed graphs callbacks and copied workers
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Enable checkout of long evidence paths
        shell: pwsh
        run: git config --system core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            diffutils
            zsh
            python
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-lld
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-lld
            mingw-w64-clang-x86_64-compiler-rt
      - name: Run real process isolation and framing failure cases
        shell: msys2 {0}
        run: make LIMITED= SANITIZER_LIMITED= COMPILER_LTO_FLAGS= CC=clang LLVM_CC=clang check-isolated-workers
      - name: Check native collector reachability and callback ownership
        if: success() || failure()
        shell: msys2 {0}
        env:
          MINYAR_SANITIZER_CLANG: /clang64/bin/clang.exe
        run: make LIMITED= SANITIZER_LIMITED= COMPILER_LTO_FLAGS= CC=clang LLVM_CC=clang check-managed-graphs check-managed-graphs-profiles check-callback-domains check-callbacks check-net-udp-offload-sanitize
      - name: Upload retained failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-isolated-workers-evidence
          path: build/test-evidence

  coverage:
    name: Compiler and runtime coverage gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install LLVM coverage tools
        run: sudo apt-get update && sudo apt-get install -y clang llvm lld make zsh
      - name: Measure and enforce coverage
        run: make LIMITED= SANITIZER_LIMITED= CC=clang LLVM_CC=clang COMPILER_LTO_FLAGS='-flto -fuse-ld=lld' check-coverage
      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-evidence
          path: build/coverage

  llvm-release-compatibility:
    name: LLVM ${{ matrix.llvm }} backend and release builds
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        llvm: [22, 23]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install official LLVM release branch packages
        env:
          LLVM_VERSION: ${{ matrix.llvm }}
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o /tmp/llvm-key.asc
          sudo gpg --dearmor -o /usr/share/keyrings/llvm-release.gpg /tmp/llvm-key.asc
          echo "deb [signed-by=/usr/share/keyrings/llvm-release.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-$LLVM_VERSION main" | sudo tee /etc/apt/sources.list.d/llvm-release.list
          sudo apt-get update
          sudo apt-get install -y "clang-$LLVM_VERSION" "llvm-$LLVM_VERSION" "lld-$LLVM_VERSION" make zsh libglfw3-dev libssl-dev pkg-config
          echo "/usr/lib/llvm-$LLVM_VERSION/bin" >> "$GITHUB_PATH"
      - name: Verify compiler, opaque IR, native renderer, and release launcher
        run: |
          mkdir -p build
          clang --version | tee build/toolchain-version.txt
          make LIMITED= SANITIZER_LIMITED= CC=clang LLVM_CC=clang COMPILER_LTO_FLAGS='-flto -fuse-ld=lld' check-portable check-release-build check-launcher-isolation check-incremental-modules
          llvm-as build/compiler-stage3.ll -o /dev/null
          opt -passes=verify -disable-output build/compiler-stage3.ll
          python3 tests/toolchain-portability.py
          python3 tests/module-driver-options.py
          python3 tests/native-graphics.py
      - name: Upload LLVM compatibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: llvm-${{ matrix.llvm }}-evidence
          path: |
            build/toolchain-version.txt
            build/fuzz
            build/mutation
            build/mutation-score.json

  peer-semantics:
    name: ${{ matrix.suite }} / ${{ matrix.gate }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: [peer-regressions, peer-cpp-java-js, peer-rust-go-zig, peer-python-swift-ruby-lua]
        gate: [check-peer-optimizations, check-peer-sanitize]
    env:
      MINYAR_TEST_CLANG: clang-18
      MINYAR_TEST_LTO_FLAGS: -flto -fuse-ld=lld-18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install versioned LLVM tools
        run: sudo apt-get update && sudo apt-get install -y clang-18 lld-18 make zsh
      - name: Run selected peer suite
        run: >-
          make LIMITED= SANITIZER_LIMITED= CC=clang-18 LLVM_CC=clang-18
          COMPILER_LTO_FLAGS='-flto -fuse-ld=lld-18'
          PEER_SUITES='tests/${{ matrix.suite }}.py' ${{ matrix.gate }}
      - name: Upload outcomes and retained failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.suite }}-${{ matrix.gate }}
          path: |
            build/peer-results/
            build/test-evidence/

  peer-testing:
    name: Peer ownership, allocation faults and LLVM contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MINYAR_LLVM_BIN: /usr/lib/llvm-18/bin
      MINYAR_TEST_CLANG: clang-18
      MINYAR_TEST_LTO_FLAGS: -flto -fuse-ld=lld-18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install versioned LLVM tools
        run: sudo apt-get update && sudo apt-get install -y clang-18 llvm-18 llvm-18-tools lld-18 make zsh
      - name: Run peer-derived correctness and harness checks
        run: >-
          make LIMITED= SANITIZER_LIMITED= CC=clang-18 LLVM_CC=clang-18
          COMPILER_LTO_FLAGS='-flto -fuse-ld=lld-18'
          check-evidence-harness check-performance-metrics check-peer-ownership check-list-literals check-list-literals-sanitize check-list-literal-runtime check-stateful-lists check-stateful-lists-sanitize check-allocation-faults check-compiler-allocation-faults check-runtime-size-guards check-scalar-cleanup-probes check-codegen check-reduction-harness
      - name: Upload results and retained failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: peer-testing-evidence
          path: |
            build/allocation-faults.json
            build/compiler-allocation-faults.json
            build/runtime-size-guards.json
            build/list-literal-runtime-results.json
            build/scalar-cleanup-probes.json
            build/codegen-results.json
            build/peer-results/
            build/test-evidence/

  quic-native:
    name: QUIC native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Enable long paths on Windows
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install Linux compiler and crypto dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang lld make zsh libssl-dev
      - name: Install macOS test certificate tooling
        if: runner.os == 'macOS'
        run: brew install openssl@3
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          update: true
          install: >-
            make zsh python mingw-w64-ucrt-x86_64-clang mingw-w64-ucrt-x86_64-lld
            mingw-w64-ucrt-x86_64-openssl
      - name: Check all protocol state at O0 and O2
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" = macOS ]; then export PATH="$(brew --prefix openssl@3)/bin:$PATH"; fi
          make LIMITED= SANITIZER_LIMITED= check-quic
      - name: Check native Windows protocol state at O0 and O2
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          make LIMITED= SANITIZER_LIMITED= COMPILER_LTO_FLAGS= CC=clang LLVM_CC=clang check-quic
      - name: Upload every protocol test outcome
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: quic-native-${{ matrix.os }}
          if-no-files-found: error
          path: |
            build/quic-native-*
            build/quic-official-adapter.*

  quic-sanitize:
    name: QUIC packet and handshake sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install compiler and crypto dependencies
        run: sudo apt-get update && sudo apt-get install -y clang lld make zsh libssl-dev
      - name: Check authenticated transport under ASan, UBSan and leak detection
        run: make LIMITED= SANITIZER_LIMITED= check-quic-sanitize
      - name: Upload sanitizer outcomes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: quic-sanitizer-evidence
          if-no-files-found: error
          path: |
            build/quic-sanitize
            build/quic-official-adapter.*

  quic-independent-peers:
    name: QUIC and fallback independent peers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install compiler and crypto dependencies
        run: sudo apt-get update && sudo apt-get install -y clang lld make zsh libssl-dev openssl redis-server
      - name: Record independent toolchains
        run: rustc --version && cargo --version && go version
      - name: Check pinned Quinn over UDP with mutual TLS
        run: |
          python3 tests/quic-quinn.py
          MINYAR_QUINN_KEY_UPDATE=1 python3 tests/quic-quinn.py
          python3 tests/quic-quinn.py --migration
          python3 tests/quic-quinn.py --resumption
          python3 tests/quic-quinn.py --early
      - name: Check pinned Go TLS and yamux fallback in both roles
        run: make -j1 LIMITED= SANITIZER_LIMITED= check-transport-go check-transport-go-sanitize
      - name: Check replacement connection ID routing and exact peer cleanup
        run: make -j1 LIMITED= SANITIZER_LIMITED= check-peer-edge-cids check-peer-edge-cids-sanitize
      - name: Check signed relay and malformed or dropped gateway cleanup
        run: make -j1 LIMITED= SANITIZER_LIMITED= check-peer-edge-relay check-peer-edge-relay-sanitize check-peer-edge-relay-lifetime check-peer-edge-relay-lifetime-sanitize
      - name: Upload peer-edge integration evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: peer-edge-integration-evidence
          path: |
            build/peer-edge-cids-native/
            build/peer-edge-cids-sanitize/
            build/peer-edge-relay-*/

  macos-phase1-desktop:
    name: macOS complete AppKit HTTP and rendered frames
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install native renderer dependencies
        run: brew install glfw pkg-config openssl@3
      - name: Record actual Darwin compiler SDK and Swift
        run: |
          uname -a
          clang --version
          xcrun --show-sdk-path
          xcrun swiftc --version
      - name: Require actual AppKit HTTP and GUI OpenGL tests
        run: |
          export PATH="$(brew --prefix openssl@3)/bin:$PATH"
          export MINYAR_PYTHON="$(command -v python3)"
          make LIMITED= SANITIZER_LIMITED= check-macos check-http check-graphics-render

  macos-phase1-sanitize:
    name: macOS complete sanitizer and collector matrix
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install native sanitizer dependencies
        run: brew install glfw pkg-config openssl@3
      - name: Record genuine native compiler and Go peer
        run: clang --version && xcrun --show-sdk-path && go version
      - name: Run original complete Darwin sanitizer aggregate
        # Includes check-quic-sanitize, all three neo SAN gates, the captured/
        # fresh/detached/full-mark native+SAN pairs via graph profiles, and the
        # original progress idle oracle. No direct-only or reduced case route.
        run: |
          export PATH="$(brew --prefix openssl@3)/bin:$PATH"
          make LIMITED= SANITIZER_LIMITED= check-managed-graphs-profiles check-sanitize
      - name: Upload retained public sanitizer outcomes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: macos-phase1-sanitizer-evidence
          path: |
            build/test-evidence
            build/cycle-*
            build/quic-sanitize
            build/quic-ack-sanitize.*
            build/quic-pto-sanitize.*
            build/quic-rfc-sanitize*
            build/quic-official-adapter.*

  phase1-ci-orchestration:
    name: Phase1 private input orchestration checks
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install standard age
        run: brew install age
      - name: Check missing gates and synthetic private input invariants
        run: python3 .github/phase1/test-qualification.py

  macos-phase1-private-atacama:
    name: macOS private frozen Atacama public build
    if: >-
      github.repository == 'O4FDev/MinLang' && github.ref == 'refs/heads/v2' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install standard encryption and native dependencies
        run: brew install age glfw pkg-config openssl@3
      - name: Run frozen owning check test all privately on exact current source
        env:
          MINYAR_PHASE1_ATACAMA_AGE_KEY: ${{ secrets.MINYAR_PHASE1_ATACAMA_AGE_KEY }}
        run: >-
          python3 .github/phase1/private-atacama.py
          --repository "$GITHUB_WORKSPACE" --sha "$GITHUB_SHA"
          --input .github/phase1/atacama-085b55736fda.tar.gz.age
          --metadata .github/phase1/atacama-input.json
          --evidence "$RUNNER_TEMP/phase1-atacama-evidence.age"
      - name: Upload only encrypted private qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: phase1-atacama-encrypted-evidence
          if-no-files-found: error
          path: ${{ runner.temp }}/phase1-atacama-evidence.age
