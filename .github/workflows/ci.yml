name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-matrix:
    # Every Linux group runs through build/tooling/scripts/check-linux, the same runner as
    # `./build/tooling/scripts/check-linux --matrix` on one host; CI shards it by group.
    name: Linux ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: correctness
            groups: --group correctness --group llvm23 --tier full
            packages: gcc libglfw3-dev libssl-dev pkg-config redis-server
            kvm: true
          - shard: sanitizers, leaks and Redis
            groups: --group correctness --tier sanitize --group leaks --group redis
            packages: libglfw3-dev libssl-dev pkg-config redis-server llvm-23
            kvm: true
          - shard: LLVM 23 peer testing
            groups: --group peer-testing
            packages: llvm-23-tools
          - shard: LLVM 23 peer semantics
            groups: --group peer-semantics
            packages: llvm-23-tools
          - shard: QUIC, peers and formats
            groups: --group quic --group formats
            packages: libssl-dev openssl redis-server libarchive-dev libzstd-dev zlib1g-dev liblz4-dev liblzma-dev libbz2-dev libxml2-dev libacl1-dev nettle-dev
          - shard: coverage, AFL++ and formatting
            groups: --group coverage --group afl --group formatting
            packages: llvm-23 afl++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install official LLVM release branch packages
        env:
          LLVM_VERSION: '23'
        run: |
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key -o /tmp/llvm-key.asc
          sudo gpg --dearmor -o /usr/share/keyrings/llvm-release.gpg /tmp/llvm-key.asc
          echo "deb [signed-by=/usr/share/keyrings/llvm-release.gpg] https://apt.llvm.org/noble/ llvm-toolchain-noble-$LLVM_VERSION main" | sudo tee /etc/apt/sources.list.d/llvm-release.list
          sudo apt-get update
          sudo apt-get install -y "clang-$LLVM_VERSION" "llvm-$LLVM_VERSION" "lld-$LLVM_VERSION" "libclang-rt-$LLVM_VERSION-dev" "llvm-$LLVM_VERSION-tools" "clang-format-$LLVM_VERSION"
          echo "/usr/lib/llvm-23/bin" >> "$GITHUB_PATH"
          for key in CC LLVM_CC MINYAR_CLANG MINYAR_TEST_CLANG; do echo "$key=/usr/lib/llvm-23/bin/clang" >> "$GITHUB_ENV"; done
          MINYAR_CLANG=/usr/lib/llvm-23/bin/clang sh tools/toolchain.sh toolchain
      - name: Install test dependencies
        env:
          PACKAGES: ${{ matrix.packages }}
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086
          sudo apt-get install -y make zsh $PACKAGES
          if command -v afl-fuzz >/dev/null; then sudo sysctl -w kernel.core_pattern=core; fi
      - name: Grant the runner access to KVM
        if: matrix.kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm --settle
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Run the shard's groups
        env:
          GROUPS: ${{ matrix.groups }}
        # shellcheck disable=SC2086
        run: |
          make -j1 LIMITED= SANITIZER_LIMITED= COMPILER_LTO_FLAGS="-flto -fuse-ld=lld -Wl,--threads=1" build/tooling/scripts/check-linux
          ./build/tooling/scripts/check-linux --source . --output-dir build/linux-evidence --jobs 8 $GROUPS
      - name: Archive fuzzing findings
        if: always()
        run: |
          find build/linux-evidence -type d -path '*/build/afl-findings' | while read -r d; do
            tar -czf "$d.tar.gz" -C "$(dirname "$d")" afl-findings
          done
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-${{ strategy.job-index }}-evidence
          if-no-files-found: error
          path: |
            build/linux-evidence/*/results.json
            build/linux-evidence/*/logs
            build/linux-evidence/**/build/quic-official-adapter.*
            build/linux-evidence/**/build/quic-rfc-native.*/run/driver-local-*
            build/linux-evidence/**/build/quic-rfc-sanitize.*/run/driver-local-*
            build/linux-evidence/**/build/mutation-score.json
            build/linux-evidence/**/build/coverage
            build/linux-evidence/**/build/afl-findings.tar.gz
            build/linux-evidence/**/build/peer-results

  macos-portable:
    name: macOS portable suite, network, graphics and Keychain
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install GLFW for native renderer checks
        run: brew install glfw pkg-config openssl@3
      - name: Select pinned LLVM 23.1.2
        run: |
          test "$(uname -m)" = arm64
          archive="$RUNNER_TEMP/LLVM-23.1.2-macOS-ARM64.tar.xz"
          llvm_prefix="$RUNNER_TEMP/minyar-llvm-23.1.2"
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 300 https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.2/LLVM-23.1.2-macOS-ARM64.tar.xz -o "$archive"
          printf '%s  %s\n' d7c26fc6177e42842e2d1ffaad31aec057c56a924392b1a23d830abe2c5d53b1 "$archive" | shasum -a 256 --check
          mkdir -p "$llvm_prefix"
          tar -xJf "$archive" -C "$llvm_prefix" --strip-components=1
          llvm_bin="$llvm_prefix/bin"
          echo "$llvm_bin" >> "$GITHUB_PATH"
          for key in CC LLVM_CC MINYAR_CLANG MINYAR_TEST_CLANG; do echo "$key=$llvm_bin/clang" >> "$GITHUB_ENV"; done
          MINYAR_CLANG="$llvm_bin/clang" sh tools/toolchain.sh toolchain
          echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"
      - name: Run check-portable and the macOS-only checks in parallel, including Keychain
        run: |
          set -o pipefail
          export PATH="$(brew --prefix openssl@3)/bin:$PATH"
          mkdir -p build/check-macos
          make LIMITED= SANITIZER_LIMITED= build/tooling/scripts/check-macos
          ./build/tooling/scripts/check-macos --tier all --jobs 3 --keychain LIMITED= SANITIZER_LIMITED= 2>&1 | tee build/check-macos/output.log
      - name: Upload generated fuzz evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-fuzz-evidence
          retention-days: 7
          path: |
            build/fuzz
            build/check-macos/output.log
            build/check-macos/*/results.json
            build/check-macos/*/logs
            build/test-evidence
            build/quic-rfc-native.*
            build/quic-rfc-sanitize.*

  macos-ordinary-performance:
    name: macOS ordinary compiler and runtime budgets
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Select pinned LLVM 23.1.2
        run: |
          test "$(uname -m)" = arm64
          archive="$RUNNER_TEMP/LLVM-23.1.2-macOS-ARM64.tar.xz"
          llvm_prefix="$RUNNER_TEMP/minyar-llvm-23.1.2"
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 300 https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.2/LLVM-23.1.2-macOS-ARM64.tar.xz -o "$archive"
          printf '%s  %s\n' d7c26fc6177e42842e2d1ffaad31aec057c56a924392b1a23d830abe2c5d53b1 "$archive" | shasum -a 256 --check
          mkdir -p "$llvm_prefix"
          tar -xJf "$archive" -C "$llvm_prefix" --strip-components=1
          llvm_bin="$llvm_prefix/bin"
          echo "$llvm_bin" >> "$GITHUB_PATH"
          for key in CC LLVM_CC MINYAR_CLANG MINYAR_TEST_CLANG; do echo "$key=$llvm_bin/clang" >> "$GITHUB_ENV"; done
          MINYAR_CLANG="$llvm_bin/clang" sh tools/toolchain.sh toolchain
          echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"
      - name: Build the ordinary fixed-point compiler
        run: |
          make LIMITED= SANITIZER_LIMITED= build/minyarc build/compiler-stage3.ll build/minyar-runtime.o
          cmp build/compiler-stage2.ll build/compiler-stage3.ll
      - name: Build previous v2 compiler with the same runtime and flags
        env:
          PREVIOUS_V2: ${{ github.event.before || github.event.pull_request.base.sha }}
        run: |
          if [ -z "$PREVIOUS_V2" ] || [ "$PREVIOUS_V2" = 0000000000000000000000000000000000000000 ]; then PREVIOUS_V2="$(git rev-parse HEAD^)"; fi
          git fetch --no-tags origin "$PREVIOUS_V2"
          control="$(mktemp -d "$RUNNER_TEMP/minyar-budget-previous.XXXXXXXX")"
          mkdir -p "$control/build"
          git archive "$PREVIOUS_V2" compiler build-support/compiler.mk | tar -x -C "$control"
          make -C "$control" -f build-support/compiler.mk build/compiler.min
          cp "$control/build/compiler.min" build/compiler-budget-input.min
          ./build/minyarc build/compiler-budget-input.min build/compiler-budget-previous.ll
          make LIMITED= SANITIZER_LIMITED= build/minyarc-budget-previous build/tooling/tests/self-compile-budget
          MINYAR_BUDGET_PREVIOUS_REF="$PREVIOUS_V2" ./build/tooling/tests/self-compile-budget --record-comparison build/minyarc-budget-previous build/compiler-budget-input.min build/performance-evidence/compiler-comparison.json
          echo "MINYAR_BUDGET_PREVIOUS_COMPILER=$GITHUB_WORKSPACE/build/minyarc-budget-previous" >> "$GITHUB_ENV"
          echo "MINYAR_BUDGET_FIXED_INPUT=$GITHUB_WORKSPACE/build/compiler-budget-input.min" >> "$GITHUB_ENV"
          echo "MINYAR_BUDGET_COMPARISON_MANIFEST=$GITHUB_WORKSPACE/build/performance-evidence/compiler-comparison.json" >> "$GITHUB_ENV"
      - name: Record native platform and PMU availability
        run: |
          mkdir -p build/performance-evidence
          uname -a | tee build/performance-evidence/platform.txt
          clang --version | tee build/performance-evidence/compiler.txt
          sysctl -n machdep.cpu.brand_string | tee build/performance-evidence/cpu.txt
          /usr/bin/time -l true 2> build/performance-evidence/pmu.txt
          cat build/performance-evidence/pmu.txt
      - name: Enforce paired CPU and wall bounds plus absolute RSS and instructions
        run: |
          set -o pipefail
          make LIMITED= SANITIZER_LIMITED= check-budget | tee build/performance-evidence/self-compile-budget.txt
          if grep -q 'instructions retired:' build/performance-evidence/self-compile-budget.txt; then
            grep 'instructions retired:' build/performance-evidence/self-compile-budget.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo '**Retired instructions unavailable:** this runner does not expose the counter. The unchanged 75-million-instruction limit is not measured by this job; see the explicit PMU probe evidence.' | tee -a "$GITHUB_STEP_SUMMARY" build/performance-evidence/instructions-unavailable.txt
          fi
      - name: Enforce ordinary runtime and compiler performance checks
        if: success() || failure()
        run: |
          set -o pipefail
          make LIMITED= SANITIZER_LIMITED= check-performance | tee build/performance-evidence/performance.txt
      - name: Upload platform and paired compiler measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-ordinary-performance-evidence
          if-no-files-found: error
          path: |
            build/performance-evidence
            build/performance.json

  quic-native:
    name: QUIC native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux QUIC runs in the linux-matrix QUIC shard.
        os: [macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install Linux compiler and crypto dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang lld make zsh libssl-dev
      - name: Install macOS test certificate tooling
        if: runner.os == 'macOS'
        run: brew install openssl@3
      - name: Select pinned LLVM 23.1.2
        run: |
          test "$(uname -m)" = arm64
          archive="$RUNNER_TEMP/LLVM-23.1.2-macOS-ARM64.tar.xz"
          llvm_prefix="$RUNNER_TEMP/minyar-llvm-23.1.2"
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 300 https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.2/LLVM-23.1.2-macOS-ARM64.tar.xz -o "$archive"
          printf '%s  %s\n' d7c26fc6177e42842e2d1ffaad31aec057c56a924392b1a23d830abe2c5d53b1 "$archive" | shasum -a 256 --check
          mkdir -p "$llvm_prefix"
          tar -xJf "$archive" -C "$llvm_prefix" --strip-components=1
          llvm_bin="$llvm_prefix/bin"
          echo "$llvm_bin" >> "$GITHUB_PATH"
          for key in CC LLVM_CC MINYAR_CLANG MINYAR_TEST_CLANG; do echo "$key=$llvm_bin/clang" >> "$GITHUB_ENV"; done
          MINYAR_CLANG="$llvm_bin/clang" sh tools/toolchain.sh toolchain
          echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"
      - name: Check all protocol state at O0 and O2
        run: |
          if [ "$RUNNER_OS" = macOS ]; then export PATH="$(brew --prefix openssl@3)/bin:$PATH"; fi
          make LIMITED= SANITIZER_LIMITED= check-quic
      - name: Upload every protocol test outcome
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: quic-native-${{ matrix.os }}
          if-no-files-found: error
          path: |
            build/quic-native-*
            build/quic-official-adapter.*
            build/quic-rfc-native.*/run/driver-local-*

  macos-phase1-desktop:
    name: macOS complete AppKit HTTP and rendered frames
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install native renderer dependencies
        run: brew install glfw pkg-config openssl@3 cmake
      - name: Select pinned LLVM 23.1.2
        run: |
          test "$(uname -m)" = arm64
          archive="$RUNNER_TEMP/LLVM-23.1.2-macOS-ARM64.tar.xz"
          llvm_prefix="$RUNNER_TEMP/minyar-llvm-23.1.2"
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 300 https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.2/LLVM-23.1.2-macOS-ARM64.tar.xz -o "$archive"
          printf '%s  %s\n' d7c26fc6177e42842e2d1ffaad31aec057c56a924392b1a23d830abe2c5d53b1 "$archive" | shasum -a 256 --check
          mkdir -p "$llvm_prefix"
          tar -xJf "$archive" -C "$llvm_prefix" --strip-components=1
          llvm_bin="$llvm_prefix/bin"
          echo "$llvm_bin" >> "$GITHUB_PATH"
          for key in CC LLVM_CC MINYAR_CLANG MINYAR_TEST_CLANG; do echo "$key=$llvm_bin/clang" >> "$GITHUB_ENV"; done
          MINYAR_CLANG="$llvm_bin/clang" sh tools/toolchain.sh toolchain
          echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"
      - name: Prepare pinned software-capable NSGL provider
        run: |
          make LIMITED= SANITIZER_LIMITED= prepare-macos-graphics
          echo "PKG_CONFIG_PATH=$GITHUB_WORKSPACE/build/ci-glfw/install/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"
      - name: Record actual Darwin compiler SDK and Swift
        run: |
          uname -a
          clang --version
          xcrun --show-sdk-path
          xcrun swiftc --version
      - name: Require actual AppKit HTTP and GUI OpenGL tests
        run: |
          export PATH="$(brew --prefix openssl@3)/bin:$PATH"
          export MINYAR_PYTHON="$(command -v python3)"
          make LIMITED= SANITIZER_LIMITED= check-macos check-http check-graphics-render

  macos-phase1-sanitize:
    name: macOS complete sanitizer and collector matrix
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install native sanitizer dependencies
        run: brew install glfw pkg-config openssl@3 go redis
      - name: Select pinned LLVM 23.1.2
        run: |
          test "$(uname -m)" = arm64
          archive="$RUNNER_TEMP/LLVM-23.1.2-macOS-ARM64.tar.xz"
          llvm_prefix="$RUNNER_TEMP/minyar-llvm-23.1.2"
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 300 https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.2/LLVM-23.1.2-macOS-ARM64.tar.xz -o "$archive"
          printf '%s  %s\n' d7c26fc6177e42842e2d1ffaad31aec057c56a924392b1a23d830abe2c5d53b1 "$archive" | shasum -a 256 --check
          mkdir -p "$llvm_prefix"
          tar -xJf "$archive" -C "$llvm_prefix" --strip-components=1
          llvm_bin="$llvm_prefix/bin"
          echo "$llvm_bin" >> "$GITHUB_PATH"
          for key in CC LLVM_CC MINYAR_CLANG MINYAR_TEST_CLANG; do echo "$key=$llvm_bin/clang" >> "$GITHUB_ENV"; done
          MINYAR_CLANG="$llvm_bin/clang" sh tools/toolchain.sh toolchain
          echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"
      - name: Record genuine native compiler and Go peer
        run: clang --version && xcrun --show-sdk-path && go version
      - name: Run original complete Darwin sanitizer aggregate
        # Includes check-quic-sanitize, all three neo SAN gates, the captured/
        # fresh/detached/full-mark native+SAN pairs via graph profiles, and the
        # original progress idle oracle. No direct-only or reduced case route.
        run: |
          export PATH="$(brew --prefix openssl@3)/bin:$PATH"
          make -k LIMITED= SANITIZER_LIMITED= check-managed-graphs-profiles check-sanitize
      - name: Upload retained public sanitizer outcomes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: macos-phase1-sanitizer-evidence
          path: |
            build/test-evidence
            build/cycle-*
            build/quic-sanitize
            build/quic-ack-sanitize.*
            build/quic-pto-sanitize.*
            build/quic-rfc-sanitize*

  phase1-ci-orchestration:
    name: Phase1 private input orchestration checks
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install standard age and the native crypto provider
        run: brew install age pkg-config openssl@3
      - name: Select pinned LLVM 23.1.2
        run: |
          test "$(uname -m)" = arm64
          archive="$RUNNER_TEMP/LLVM-23.1.2-macOS-ARM64.tar.xz"
          llvm_prefix="$RUNNER_TEMP/minyar-llvm-23.1.2"
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 300 https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.2/LLVM-23.1.2-macOS-ARM64.tar.xz -o "$archive"
          printf '%s  %s\n' d7c26fc6177e42842e2d1ffaad31aec057c56a924392b1a23d830abe2c5d53b1 "$archive" | shasum -a 256 --check
          mkdir -p "$llvm_prefix"
          tar -xJf "$archive" -C "$llvm_prefix" --strip-components=1
          llvm_bin="$llvm_prefix/bin"
          echo "$llvm_bin" >> "$GITHUB_PATH"
          for key in CC LLVM_CC MINYAR_CLANG MINYAR_TEST_CLANG; do echo "$key=$llvm_bin/clang" >> "$GITHUB_ENV"; done
          MINYAR_CLANG="$llvm_bin/clang" sh tools/toolchain.sh toolchain
          echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"
      - name: Build the Phase1 orchestration tools
        run: make LIMITED= SANITIZER_LIMITED= phase1-tools
      - name: Check missing gates and synthetic private input invariants
        run: ./build/tooling/.github/phase1/test-qualification

  macos-phase1-private-atacama:
    name: macOS private frozen Atacama public build
    if: >-
      github.repository == 'O4FDev/MinLang' && github.ref == 'refs/heads/v2' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install standard encryption and native dependencies
        run: brew install age glfw pkg-config openssl@3
      - name: Select pinned LLVM 23.1.2
        run: |
          test "$(uname -m)" = arm64
          archive="$RUNNER_TEMP/LLVM-23.1.2-macOS-ARM64.tar.xz"
          llvm_prefix="$RUNNER_TEMP/minyar-llvm-23.1.2"
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 300 https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.2/LLVM-23.1.2-macOS-ARM64.tar.xz -o "$archive"
          printf '%s  %s\n' d7c26fc6177e42842e2d1ffaad31aec057c56a924392b1a23d830abe2c5d53b1 "$archive" | shasum -a 256 --check
          mkdir -p "$llvm_prefix"
          tar -xJf "$archive" -C "$llvm_prefix" --strip-components=1
          llvm_bin="$llvm_prefix/bin"
          echo "$llvm_bin" >> "$GITHUB_PATH"
          for key in CC LLVM_CC MINYAR_CLANG MINYAR_TEST_CLANG; do echo "$key=$llvm_bin/clang" >> "$GITHUB_ENV"; done
          MINYAR_CLANG="$llvm_bin/clang" sh tools/toolchain.sh toolchain
          echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"
      - name: Build the private orchestration helper
        run: make LIMITED= SANITIZER_LIMITED= build/tooling/.github/phase1/private-atacama
      - name: Run frozen owning check test all privately on exact current source
        env:
