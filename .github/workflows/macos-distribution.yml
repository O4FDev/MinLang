name: macOS binary distributions

# Produce candidates for testing. Publishing requires a separate signing and
# notarization step with Developer ID credentials; this workflow has none.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Candidate version (for example 0.1.0-rc1)
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download official Apple silicon LLVM
        if: matrix.arch == 'arm64'
        run: |
          set -eu
          archive="$RUNNER_TEMP/llvm.tar.xz"
          curl --fail --location --retry 3 --max-time 600 'https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.2/LLVM-23.1.2-macOS-ARM64.tar.xz' -o "$archive"
          printf '%s  %s\n' 'd7c26fc6177e42842e2d1ffaad31aec057c56a924392b1a23d830abe2c5d53b1' "$archive" | shasum -a 256 --check
          mkdir "$RUNNER_TEMP/llvm"
          tar -xJf "$archive" -C "$RUNNER_TEMP/llvm" --strip-components=1
          echo "MINYAR_LLVM_ROOT=$RUNNER_TEMP/llvm" >> "$GITHUB_ENV"
      - name: Build native Intel LLVM from pinned upstream source
        if: matrix.arch == 'x86_64'
        run: |
          set -eu
          archive="$RUNNER_TEMP/llvm-source.tar.xz"
          curl --fail --location --retry 3 --max-time 600 'https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.2/llvm-project-23.1.2.src.tar.xz' -o "$archive"
          printf '%s  %s\n' 'c98bbef08a2b4c2613cd50e9aa9ae7b69b1fe6c16b2c40373bc0ab6116fdf78a' "$archive" | shasum -a 256 --check
          mkdir "$RUNNER_TEMP/llvm-source"
          tar -xJf "$archive" -C "$RUNNER_TEMP/llvm-source" --strip-components=1
          cmake -S "$RUNNER_TEMP/llvm-source/llvm" -B "$RUNNER_TEMP/llvm-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DLLVM_ENABLE_PROJECTS='clang;lld' -DLLVM_ENABLE_RUNTIMES=compiler-rt \
            -DLLVM_TARGETS_TO_BUILD=X86 -DLLVM_INCLUDE_TESTS=OFF -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_ENABLE_ZSTD=OFF -DLLVM_ENABLE_ZLIB=OFF -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_LIBEDIT=OFF -DLLVM_ENABLE_TERMINFO=OFF \
            -DCOMPILER_RT_BUILD_SANITIZERS=OFF -DCOMPILER_RT_BUILD_XRAY=OFF \
            -DCOMPILER_RT_BUILD_LIBFUZZER=OFF -DCOMPILER_RT_BUILD_MEMPROF=OFF \
            -DCOMPILER_RT_BUILD_ORC=OFF
          cmake --build "$RUNNER_TEMP/llvm-build" --target clang lld dsymutil compiler-rt --parallel 3
          ln -sf lld "$RUNNER_TEMP/llvm-build/bin/ld64.lld"
          echo "MINYAR_LLVM_ROOT=$RUNNER_TEMP/llvm-build" >> "$GITHUB_ENV"
      - name: Package and audit macOS 14 deployment targets and dependencies
        env:
          MINYAR_VERSION: ${{ inputs.version }}
        run: make package-macos
      - name: Test an extracted candidate
        run: |
          set -eu
          archive=$(find "$GITHUB_WORKSPACE/build/releases" -name '*.tar.gz' -type f)
          cd "$GITHUB_WORKSPACE/build/releases"
          shasum -a 256 --check "$(basename "$archive").sha256"
          mkdir "$RUNNER_TEMP/extracted"
          tar -xzf "$archive" -C "$RUNNER_TEMP/extracted"
          distribution=$(find "$RUNNER_TEMP/extracted" -mindepth 1 -maxdepth 1 -type d)
          chmod -R a-w "$distribution"
          python3 "$GITHUB_WORKSPACE/tests/macos-distribution.py" --distribution "$distribution"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: minyar-macos-${{ matrix.arch }}
          if-no-files-found: error
          path: build/releases/*

  compatibility:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15
            arch: arm64
          - runner: macos-26
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-26-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: minyar-macos-${{ matrix.arch }}
          path: candidate
      - name: Verify the same artifact on another macOS version
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE/candidate"
          shasum -a 256 --check ./*.sha256
          mkdir "$RUNNER_TEMP/extracted"
          tar -xzf ./*.tar.gz -C "$RUNNER_TEMP/extracted"
          distribution=$(find "$RUNNER_TEMP/extracted" -mindepth 1 -maxdepth 1 -type d)
          chmod -R a-w "$distribution"
          python3 "$GITHUB_WORKSPACE/tests/macos-distribution.py" --distribution "$distribution"
