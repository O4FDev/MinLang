name: WebAssembly

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wasm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playground:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install the pinned native LLVM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y make zsh zstd libxml2 libtinfo6
          archive="$RUNNER_TEMP/LLVM-23.1.2-Linux-X64.tar.zst"
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 600 \
            https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.2/LLVM-23.1.2-Linux-X64.tar.zst -o "$archive"
          printf '%s  %s\n' 6382de1c1a210ce5a5cc49d18bc8444d137742e7cbf9b19f4ae602bb1ab52534 "$archive" | sha256sum --check
          sudo mkdir -p /usr/lib/llvm-23
          sudo tar --use-compress-program='zstd --long=30' -xf "$archive" -C /usr/lib/llvm-23 --strip-components=1
          echo '/usr/lib/llvm-23/bin' >> "$GITHUB_PATH"
          for key in CC LLVM_CC MINYAR_CLANG MINYAR_TEST_CLANG; do echo "$key=/usr/lib/llvm-23/bin/clang" >> "$GITHUB_ENV"; done
      - name: Build and test WebAssembly programs and the browser playground
        run: make -j8 LIMITED= SANITIZER_LIMITED= prepare-playground-tests check-playground
      - name: Upload the tested self-contained static site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: try-minyar
          path: build/playground
          if-no-files-found: error
      - name: Upload measurements and browser screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wasm-evidence
          path: build/wasm-evidence
          if-no-files-found: error
