name: Release signing TEST artifacts

# Manual, local-artifact evidence only. No release/R2 deployment or production secrets.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native TEST platform
        type: choice
        options: [macos]
        default: macos

permissions:
  contents: read

jobs:
  macos:
    if: inputs.platform == 'macos'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install OpenSSL 3 and pkg-config
        run: brew install pkg-config openssl@3
      - name: Select pinned LLVM 23.1.2
        run: |
          test "$(uname -m)" = arm64
          archive="$RUNNER_TEMP/LLVM-23.1.2-macOS-ARM64.tar.xz"
          llvm_prefix="$RUNNER_TEMP/minyar-llvm-23.1.2"
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 300 https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.2/LLVM-23.1.2-macOS-ARM64.tar.xz -o "$archive"
          printf '%s  %s\n' d7c26fc6177e42842e2d1ffaad31aec057c56a924392b1a23d830abe2c5d53b1 "$archive" | shasum -a 256 --check
          mkdir -p "$llvm_prefix"
          tar -xJf "$archive" -C "$llvm_prefix" --strip-components=1
          llvm_bin="$llvm_prefix/bin"
          echo "$llvm_bin" >> "$GITHUB_PATH"
          for key in CC LLVM_CC MINYAR_CLANG MINYAR_TEST_CLANG; do echo "$key=$llvm_bin/clang" >> "$GITHUB_ENV"; done
          MINYAR_CLANG="$llvm_bin/clang" sh tools/toolchain.sh toolchain
          echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"
      - name: Build release signing tools
        run: |
          export PATH="$(brew --prefix openssl@3)/bin:$PATH"
          make LIMITED= SANITIZER_LIMITED= build/tooling/tests/release-signing build/tooling/tests/release-pipeline build/tooling/scripts/release
      - name: Signing contracts
        run: ./build/tooling/tests/release-signing
      - name: Ephemeral trusted TEST signing and complete updater roundtrip
        shell: bash
        run: |
          set -euo pipefail
          openssl_path="$(brew --prefix openssl@3)/bin/openssl"
          test -x "$openssl_path"
          ./build/tooling/tests/release-pipeline --native macos --ephemeral-macos-ci \
            --cc /usr/bin/clang --openssl "$openssl_path" \
            --output "$RUNNER_TEMP/TEST-macos-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --report "$RUNNER_TEMP/TEST-macos-status-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
      - name: Upload public TEST evidence after credential cleanup
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TEST-macos-signing-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/TEST-macos-${{ github.run_id }}-${{ github.run_attempt }}/
            ${{ runner.temp }}/TEST-macos-status-${{ github.run_id }}-${{ github.run_attempt }}.json
