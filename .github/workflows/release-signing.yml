name: Release signing TEST artifacts

# Manual, local-artifact evidence only. No release/R2 deployment or production secrets.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native TEST platform
        type: choice
        options: [macos]
        default: macos

permissions:
  contents: read

jobs:
  macos:
    if: inputs.platform == 'macos'
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Python signing contracts
        run: |
          python3 tests/release-signing.py
          python3 tests/shipping.py
      - name: Ephemeral trusted TEST signing and complete updater roundtrip
        shell: bash
        run: |
          set -euo pipefail
          openssl_path="$(brew --prefix openssl@3)/bin/openssl"
          test -x "$openssl_path"
          python3 tests/release-pipeline.py --native macos --ephemeral-macos-ci \
            --cc /usr/bin/clang --openssl "$openssl_path" \
            --output "$RUNNER_TEMP/TEST-macos-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --report "$RUNNER_TEMP/TEST-macos-status-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
      - name: Upload public TEST evidence after credential cleanup
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TEST-macos-signing-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/TEST-macos-${{ github.run_id }}-${{ github.run_attempt }}/
            ${{ runner.temp }}/TEST-macos-status-${{ github.run_id }}-${{ github.run_attempt }}.json
