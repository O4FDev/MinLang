version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'
  - package-ecosystem: npm
    directory: /editors/vscode
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directories:
      - /benchmarks/httpserver/axum
      - /tests/interop/quinn
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directories:
      - /tests/interop/yamux
      - /tests/interop/peergrpc
      - /tests/interop/peeredge
    schedule:
      interval: weekly
