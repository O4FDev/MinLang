// The service check-connect-node calls; client.mjs embeds its descriptor.
// Regenerate with: protoc --descriptor_set_out=/dev/stdout interop.proto | base64
syntax = "proto3";
package minyar.interop.v1;

message Ping {
  string text = 1;
  int32 code = 2;
  int32 delay_ms = 3;
}
message Pong {
  string text = 1;
}
service Interop {
  rpc Echo(Ping) returns (Pong);
  rpc Fail(Ping) returns (Pong);
  rpc Slow(Ping) returns (Pong);
  rpc Lookup(Ping) returns (Pong) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc Count(Ping) returns (Pong);
  rpc Missing(Ping) returns (Pong);
  // Sends `code` messages, one every `delay_ms`; text "fail" ends in ABORTED.
  rpc Stream(Ping) returns (stream Pong);
}
