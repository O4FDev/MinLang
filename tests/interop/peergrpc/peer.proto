syntax = "proto3";
package hearth.peer.v1;

// Private Tolum gateway mapping. Open MUST be the first request message;
// status MUST be the first successful response message. Token bytes are exact.
service PeerGateway {
  rpc Dial(stream DialRequest) returns (stream DialResponse);
}

message Open {
  bytes dial_grant_bytes = 1;
  string exit_id = 2;
  string conn_id = 3;
  uint64 deadline = 4; // Unix seconds, checked against the signed grant expiry.
}

message DialRequest {
  oneof frame {
    Open open = 1;
    bytes data = 2;
  }
}

enum DialStatus {
  UNSPECIFIED = 0;
  OK = 1;
  GRANT_INVALID = 2;
  EXIT_OFFLINE = 3;
  POLICY_DENIED = 4;
}

message DialResponse {
  oneof frame {
    DialStatus status = 1;
    bytes data = 2;
  }
}
