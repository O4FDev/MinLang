syntax = "proto3";
// Exact unqualified schema from HEARTH_PRODUCT_SPEC.md section 10.3.2.
service PeerEdgeDial {
  rpc OpenExitStream(stream ExitByteFrame) returns (stream ExitByteFrame);
}
message ExitByteFrame {
  oneof body {
    OpenExitStreamRequest open = 1;
    ExitStatus status = 2;
    bytes data = 3;
  }
}
message OpenExitStreamRequest {
  bytes dial_grant = 1;
  string exit_id = 2;
  string conn_id = 3;
}
message ExitStatus {
  enum Code {
    OK = 0;
    GRANT_INVALID = 1;
    EXIT_OFFLINE = 2;
    POLICY_DENIED = 3;
    CONCURRENCY_FULL = 4;
  }
  Code code = 1;
  string detail = 2;
}
