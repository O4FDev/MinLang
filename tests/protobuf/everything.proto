syntax = "proto3";
package sample;

import "sample/shared.proto";

// Every proto3 field shape the generator supports.
message Everything {
  int32 int32_value = 1;
  int64 int64_value = 2;
  uint32 uint32_value = 3;
  uint64 uint64_value = 4;
  sint32 sint32_value = 5;
  sint64 sint64_value = 6;
  fixed32 fixed32_value = 7;
  fixed64 fixed64_value = 8;
  sfixed32 sfixed32_value = 9;
  sfixed64 sfixed64_value = 10;
  float float_value = 11;
  double double_value = 12;
  bool bool_value = 13;
  string string_value = 14;
  bytes bytes_value = 15;
  shared.Color color = 16;
  shared.Point point = 17;
  Everything recursive = 18;
  optional int32 optional_int32 = 19;
  optional string optional_string = 20;
  Mood mood = 21;

  repeated int32 packed_int32 = 31;
  repeated sint64 packed_sint64 = 32;
  repeated double packed_double = 33;
  repeated fixed32 packed_fixed32 = 34;
  repeated bool packed_bool = 35;
  repeated shared.Color packed_color = 36;
  repeated int64 unpacked_int64 = 37 [packed = false];
  repeated string strings = 38;
  repeated bytes blobs = 39;
  repeated shared.Point points = 40;

  map<string, int32> counts = 50;
  map<int64, string> names = 51;
  map<bool, shared.Point> flags = 52;
  map<uint32, shared.Color> colors = 53;
  map<string, Everything> children = 54;

  oneof choice {
    uint32 choice_number = 60;
    string choice_text = 61;
    shared.Point choice_point = 62;
    shared.Color choice_color = 63;
  }

  // Names that need care in Minyar.
  int32 type = 70;
  int32 match = 71;
  int32 unknown_fields = 72;
  int32 _leading = 73;

  enum Mood {
    MOOD_UNSPECIFIED = 0;
    HAPPY = 1;
    CALM = 2;
    PEACEFUL = 2 [deprecated = true];
    option allow_alias = true;
  }
}

message Empty {}
