syntax = "proto2";
package legacy;

// proto2 presence, defaults, closed enums and groups.
message Legacy {
  enum Size {
    SMALL = 1;
    LARGE = 2;
  }
  required string name = 1;
  optional int32 count = 2 [default = -7];
  optional double ratio = 3 [default = 1.5];
  optional float tiny = 4 [default = -inf];
  optional bool enabled = 5 [default = true];
  optional string label = 6 [default = "say \"hi\"\n"];
  optional Size size = 7 [default = LARGE];
  optional uint64 big = 8 [default = 18446744073709551615];
  repeated Size sizes = 9;
  repeated int32 values = 10 [packed = true];
  optional group Item = 11 {
    optional int32 id = 12;
    optional string note = 13;
  }
  repeated group Entry = 14 {
    optional int32 key = 15;
  }
  optional Legacy next = 16;
  extensions 100 to 199;
}
