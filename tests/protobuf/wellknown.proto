syntax = "proto3";
package sample.wellknown;

import "google/protobuf/any.proto";
import "google/protobuf/api.proto";
import "google/protobuf/descriptor.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/source_context.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/type.proto";
import "google/protobuf/wrappers.proto";

// Every well-known type, so `buf generate --include-wkt` generates them all.
message WellKnown {
  google.protobuf.Any any = 1;
  google.protobuf.Api api = 2;
  google.protobuf.FileDescriptorProto file = 3;
  google.protobuf.Duration duration = 4;
  google.protobuf.Empty empty = 5;
  google.protobuf.FieldMask mask = 6;
  google.protobuf.SourceContext context = 7;
  google.protobuf.Struct struct = 8;
  google.protobuf.Timestamp time = 9;
  google.protobuf.Type type = 10;
  google.protobuf.Int64Value count = 11;
  repeated google.protobuf.Value values = 12;
  map<string, google.protobuf.ListValue> lists = 13;
}
