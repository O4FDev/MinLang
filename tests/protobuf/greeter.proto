syntax = "proto3";
package sample.greeter;

import "google/protobuf/timestamp.proto";
import "sample/shared.proto";

// A service with every method shape the generator emits.
service Greeter {
  rpc SayHello(HelloRequest) returns (HelloReply);
  rpc Lookup(sample.shared.Point) returns (HelloReply) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc Touch(HelloRequest) returns (google.protobuf.Timestamp) {
    option idempotency_level = IDEMPOTENT;
  }
  rpc CountDown(HelloRequest) returns (stream HelloReply);
  rpc Upload(stream HelloRequest) returns (HelloReply);
}

message HelloRequest {
  string name = 1;
  int32 count = 2;
}

message HelloReply {
  string message = 1;
}
