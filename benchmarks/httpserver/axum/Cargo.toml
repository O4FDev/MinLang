[package]
name = "minyar-httpserver-axum-front"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "=1.54.0", features = ["macros", "rt", "net", "io-util", "time"] }

[profile.release]
lto = "thin"
codegen-units = 1
